# @package _global_

tags: ["pdb", "hot"]

datamodule:
  _target_: tabasco.data.lmdb_datamodule.LmdbDataModule

  data_dir: ./data/alphadb.pt
  val_data_dir: ./data/scope.pt
  test_data_dir: ./data/scope.pt
  lmdb_dir: ./data/lmdb_pdb

  add_random_rotation: true
  add_random_permutation: false
  reorder_to_smiles_order: true
  remove_hydrogens: true

  batch_size: 128
  num_workers: 0

model:
  net:
    _target_: tabasco.models.components.transformer_module.TransformerModule
    hidden_dim: 64
    num_layers: 16
    num_heads: 8
    activation: SiLU
    implementation: reimplemented # pytorch
    cross_attention: true
    kl_dim: 32

callbacks:
  ema:
    _target_: tabasco.callbacks.ema.EMA
    decay: 0.999
    every_n_steps: 1

lightning_module:
  optimizer:
    lr: 0.0001

logger:
  wandb:
    name: "tabasco-hot-pdb-kl32"
    project: "tabasco"
